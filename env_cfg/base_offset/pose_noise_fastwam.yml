# Base-pose noise experiment for FastWAM on the same finer noise range as pose_noise_pi05.yml (same tasks, seeds and
# noise_seed, so both policies see the same per-episode offsets). Results land in <out_dir>/FastWAM/<task>/<level>.jsonl.
policy_name: FastWAM
ckpt_name: RoboTwin-cotrain-aloha_agilex-joint-0
action_type: joint
env_cfg_type: aloha_agilex
port: 6002
# Mirrors XPolicyLab/policy/FastWAM/setup_eval_policy_server.sh (which needs conda) for the .venv_fastwam venv;
# scripts/fastwam_policy_server.py keeps the text encoder on the CPU so the simulator fits on the same GPU.
server_cmd: "env PYTHONPATH=.:XPolicyLab/policy/FastWAM/FastWAM:XPolicyLab/policy/FastWAM/FastWAM/src DIFFSYNTH_MODEL_BASE_PATH=XPolicyLab/policy/FastWAM/FastWAM/checkpoints .venv_fastwam/bin/python scripts/fastwam_policy_server.py --config_path XPolicyLab/policy/FastWAM/deploy.yml --overrides port={port} host=localhost bench_name=RoboTwin policy_name=FastWAM ckpt_name=RoboTwin-cotrain-aloha_agilex-joint-0 env_cfg_type=aloha_agilex action_type=joint action_dim=14 checkpoint_path=XPolicyLab/policy/FastWAM/checkpoints/RoboTwin-cotrain-aloha_agilex-joint-0/checkpoints/weights/step_136320.pt dataset_stats_path=XPolicyLab/policy/FastWAM/checkpoints/RoboTwin-cotrain-aloha_agilex-joint-0/dataset_stats.json"

task_names: [lift_pot, open_laptop, stack_blocks_two]
task_config: demo_clean_novideo   # eval_video_log off, front camera not rendered (layouts unchanged)
render_each_action: false         # the policy only reads the newest observation
test_num: 30                      # rollouts per task and level
seed: 0                           # episode seeds start at 100000 * (1 + seed)
noise_seed: 0

levels:
  - {name: nominal,          xy_m: 0.0,   yaw_deg: 0.0}
  - {name: n2p5cm_2deg,      xy_m: 0.025, yaw_deg: 2.0}
  - {name: n5cm_4p5deg,      xy_m: 0.05,  yaw_deg: 4.5}
  - {name: n10cm_9deg,       xy_m: 0.10,  yaw_deg: 9.0}
  - {name: n15cm_13deg,      xy_m: 0.15,  yaw_deg: 13.0}

out_dir: eval_result/base_offset/pose_noise_fine_v1
