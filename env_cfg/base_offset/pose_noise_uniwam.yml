# Base-pose noise experiment for UniWAM (XPolicyLab adapter OLA_SEM) on the same finer noise range as
# pose_noise_pi05.yml / pose_noise_fastwam.yml (same tasks, seeds and noise_seed, so all policies see the same
# per-episode offsets). Results land in <out_dir>/OLA_SEM/<task>/<level>.jsonl.
policy_name: OLA_SEM
ckpt_name: UniWAM-robotwin-clean
action_type: joint
env_cfg_type: aloha_agilex
port: 6003
# Mirrors XPolicyLab/policy/OLA_SEM/setup_eval_policy_server.sh (which needs conda) for the .venv_ola_sem prefix;
# scripts/ola_sem_policy_server.py keeps the T5 text encoder on the CPU so the simulator fits on the same GPU.
server_cmd: "env PYTHONPATH=.:XPolicyLab .venv_ola_sem/bin/python scripts/ola_sem_policy_server.py --config_path XPolicyLab/policy/OLA_SEM/deploy.yml --overrides port={port} host=127.0.0.1 bench_name=RoboTwin policy_name=OLA_SEM ckpt_name=UniWAM-robotwin-clean env_cfg_type=aloha_agilex action_type=joint wan_path=XPolicyLab/policy/OLA_SEM/ola_sem/pretrained_models/Wan2.2-TI2V-5B vlm_path=XPolicyLab/policy/OLA_SEM/ola_sem/pretrained_models/Qwen3-VL-2B-Instruct"

task_names: [lift_pot, open_laptop, stack_blocks_two]
task_config: demo_clean_novideo   # eval_video_log off, front camera not rendered (layouts unchanged)
render_each_action: true          # history-flow conditions on the qpos after every executed action
test_num: 30                      # rollouts per task and level
seed: 0                           # episode seeds start at 100000 * (1 + seed)
noise_seed: 0

levels:
  - {name: nominal,          xy_m: 0.0,   yaw_deg: 0.0}
  - {name: n2p5cm_2deg,      xy_m: 0.025, yaw_deg: 2.0}
  - {name: n5cm_4p5deg,      xy_m: 0.05,  yaw_deg: 4.5}
  - {name: n10cm_9deg,       xy_m: 0.10,  yaw_deg: 9.0}
  - {name: n15cm_13deg,      xy_m: 0.15,  yaw_deg: 13.0}

out_dir: eval_result/base_offset/pose_noise_fine_v1
